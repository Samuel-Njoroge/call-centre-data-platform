services:
  dagster:
    build:
      context: .
      dockerfile: dagster_project/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
    env_file:
      - .env
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    environment:
      - HOME=/tmp

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    volumes:
      # Read-only: Superset only ever queries the local DuckDB warehouse, never
      # writes to it -- Dagster's own mount (above) is the only writer.
      - .:/workspace:ro
      # Superset's own metadata (SQLite db, saved charts/dashboards) -- persists
      # across restarts/rebuilds without living in the image or the repo.
      - superset_home:/app/superset_home
    env_file:
      - .env

volumes:
  superset_home:
