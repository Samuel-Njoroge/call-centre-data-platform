callhouse:
  target: local
  outputs:

    local:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'warehouse_local.duckdb') }}"
      schema: main
      threads: 4

    redshift:
      type: redshift
      host: "{{ env_var('REDSHIFT_HOST') }}"
      port: "{{ env_var('REDSHIFT_PORT', '5439') | int }}"
      dbname: "{{ env_var('REDSHIFT_DATABASE') }}"
      user: "{{ env_var('REDSHIFT_DBT_USER') }}"
      password: "{{ env_var('REDSHIFT_DBT_PASSWORD') }}"
      schema: staging
      threads: 4
      sslmode: require
      ra3_node: true
