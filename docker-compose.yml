services:
  dagster:
    build:
      context: .
      dockerfile: dagster_project/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
    env_file:
      - .env
    environment:
      # DBT_TARGET is a run-mode selector, not a secret, so it isn't in .env --
      # defaults to local (zero cloud dependency) unless set on the host shell
      # before `docker compose up`, e.g. `DBT_TARGET=redshift docker compose up`.
      - DBT_TARGET=${DBT_TARGET:-local}

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    volumes:
      # Read-only: Superset only ever queries the local DuckDB warehouse, never
      # writes to it -- Dagster's own mount (above) is the only writer.
      - .:/workspace:ro
      # Superset's own metadata (SQLite db, saved charts/dashboards) -- persists
      # across restarts/rebuilds without living in the image or the repo.
      - superset_home:/app/superset_home
    env_file:
      - .env

volumes:
  superset_home:
